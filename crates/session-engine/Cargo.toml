# SPDX-License-Identifier: Apache-2.0
[package]
name = "mh-session"
version = "1.0.0"
edition = "2021"
description = "Platform-independent FX session engine and shared generated rules for MH Ticker, Pine and MQL5."
license = "Apache-2.0"
repository = "https://github.com/mariyaholic/mh-ticker"
authors = ["mariyaholic"]

[lib]
name = "mh_session"
path = "src/lib.rs"

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = { version = "=0.10.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
