# SPDX-License-Identifier: MIT
[package]
name = "mh-specgen"
version = "1.0.0"
edition = "2021"
description = "Generator for MH Ticker session rules, Pine v6 and MQL5 artifacts."
license = "MIT"
repository = "https://github.com/mariyaholic/mh-ticker"
authors = ["mariyaholic"]

[[bin]]
name = "gen-spec"
path = "src/main.rs"

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = { version = "=0.10.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
